<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exponent Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 60px auto;
      padding: 0 20px;
      color: #222;
    }
    h1 {
      font-size: 24px;
    }
    label {
      display: block;
      margin-top: 15px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #result {
      margin-top: 25px;
      font-size: 20px;
    }
    .error {
      color: red;
    }
  </style>
</head>

<body>

  <h1>Exponent Calculator: x<sup>y</sup></h1>
  <p>Calculates base<sup>exponent</sup> using the C program in our Docker image.</p>

  <!-- The two inputs -->
  <label>Base
    <input type="text" id="base" value="2">
  </label>

  <label>Exponent
    <input type="text" id="exponent" value="10">
  </label>

  <button onclick="calculate()">Calculate</button>

  <!-- The answer will be written here -->
  <p id="result"></p>

  <script>
    // Runs when the button is clicked
    function calculate() {
      // 1. Read what the user typed
      var base = document.getElementById("base").value;
      var exponent = document.getElementById("exponent").value;

      // 2. Ask our server to run the C program
      var url = "/calculate?base=" + encodeURIComponent(base) +
                "&exponent=" + encodeURIComponent(exponent);

      fetch(url)
        .then(function (response) { return response.json(); })
        // {"ok": true, "output": "2 ^ 10 = 1024"}
        .then(function (data) {
          // data.ok gives true
          // data.output gives "2 ^ 10 = 1024"

          // connect to where we want to update the result
          var result = document.getElementById("result");
          result.className = data.ok ? "" : "error";

          // If the C program reported an error, just show its message
          if (!data.ok) {
            result.textContent = data.output;
            return;
          }

          // The C output looks like "2 ^ 10 = 1024".
          // Take the part after "= " as the answer.
          var answer = data.output.split("= ")[1];

          // 3. Build:  base <sup>exponent</sup> = answer
          result.textContent = "";                       // clear the old result
          result.append(base);                           // 2

          var sup = document.createElement("sup");       // <sup></sup>
          sup.textContent = exponent;                    // 10
          result.append(sup);

          result.append(" = " + answer);                 // = 1024
        });
    }
  </script>
</body>
</html>
